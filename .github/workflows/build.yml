name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build DeviceJoiner
        run: dotnet build DeviceJoiner.csproj -c Release

      - name: Test join error policy
        run: dotnet run --project tests/JoinErrorPolicyTests/JoinErrorPolicyTests.csproj -c Release
